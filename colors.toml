# Gehrmann Solutions (dark). Brand colours from gehrmann.solutions: navy #192031, electric blue #2e3eff.
# The brand blue is the accent (borders, focus, selection marks); the terminal blues are lighter so text
# in them stays readable on navy (WCAG: blue 4.9:1, bright_blue 7.0:1 on the background).
mode = "dark"

accent = "#2e3eff"
selection = "#34427a"
muted = "#6f7a91"

background = "#192031"
dark_background = "#12172a"
darker_background = "#0c0f1c"
lighter_background = "#242e47"

foreground = "#f5f6fa"
dark_foreground = "#8890a3"
light_foreground = "#ffffff"
bright_foreground = "#ffffff"

red = "#e2637a"
yellow = "#e0b34d"
orange = "#e39a5c"
green = "#4fd6a0"
cyan = "#4fc3e0"
blue = "#7480ff"
magenta = "#c792ea"
brown = "#e08a4f"

bright_red = "#f27f93"
bright_yellow = "#f0c56b"
bright_green = "#6ee3b4"
bright_cyan = "#6fd4ec"
bright_blue = "#9aa3ff"
bright_magenta = "#d8abf0"

# Window borders: brand blue into cyan, like the logo's glow; inactive ones in the selection navy.
hyprland_active_border = "rgba(2e3effee) rgba(4fc3e0ee) 45deg"
hyprland_inactive_border = "rgba(34427aaa)"
